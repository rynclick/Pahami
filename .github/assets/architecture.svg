<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f7a5c"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b8a7f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b3d30" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0f7a5c" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Card -->
  <rect width="1280" height="1170" rx="24" fill="#f6fbf9"/>
  <rect width="1280" height="1170" rx="24" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="1169" rx="24" fill="none" stroke="#cfe6dc"/>

  <!-- Title -->
  <text x="40" y="58" font-size="30" font-weight="800" fill="#0b3d30" letter-spacing="-0.5">How Pahami works</text>
  <text x="40" y="88" font-size="16" fill="#3d6b5c">One message in, a chain of agent steps out.</text>
  <g font-size="14" font-weight="600">
    <rect x="852" y="66" width="22" height="22" rx="6" fill="#0866ff"/>
    <text x="884" y="83" fill="#3d6b5c">calls a Meta model</text>
    <rect x="1036" y="66" width="22" height="22" rx="6" fill="#ffffff" stroke="#bfe0d2" stroke-width="1.5"/>
    <text x="1068" y="83" fill="#3d6b5c">plain PHP code</text>
  </g>

  <!-- Row 0: channels -->
  <g filter="url(#shadow)">
    <rect x="160" y="120" width="420" height="92" rx="14" fill="#ffffff" stroke="#bfe0d2" stroke-width="1.5"/>
    <rect x="700" y="120" width="420" height="92" rx="14" fill="#ffffff" stroke="#bfe0d2" stroke-width="1.5"/>
  </g>
  <circle cx="190" cy="146" r="11" fill="#25d366"/>
  <path d="M185 146 l3.5 3.5 l6.5 -7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="153" font-size="20" font-weight="700" fill="#0b3d30">WhatsApp</text>
  <text x="182" y="180" font-size="14" fill="#0b3d30">Fonnte webhook → Webhook\Fonnte → fonnte:process</text>
  <text x="182" y="200" font-size="13" fill="#6b8a7f">answers the webhook at once, works in the background</text>

  <rect x="721" y="137" width="22" height="18" rx="3" fill="none" stroke="#0f7a5c" stroke-width="2"/>
  <line x1="721" y1="142" x2="743" y2="142" stroke="#0f7a5c" stroke-width="2"/>
  <text x="752" y="153" font-size="20" font-weight="700" fill="#0b3d30">Browser simulator</text>
  <text x="722" y="180" font-size="14" fill="#0b3d30">/demo/chat → DemoChat</text>
  <text x="722" y="200" font-size="13" fill="#6b8a7f">same pipeline, replies shown on a phone-style page</text>

  <g stroke="#0f7a5c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="370" y1="212" x2="370" y2="258"/>
    <line x1="910" y1="212" x2="910" y2="258"/>
  </g>

  <!-- Row 1: InboundHandler -->
  <rect x="160" y="262" width="960" height="64" rx="14" fill="#0f7a5c" filter="url(#shadow)"/>
  <text x="640" y="292" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">InboundHandler</text>
  <text x="640" y="314" text-anchor="middle" font-size="14" fill="#d4efe4">routes each message by type · state lives in the database, so a case continues across days</text>

  <g stroke="#0f7a5c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="330" y1="326" x2="330" y2="376"/>
    <line x1="950" y1="326" x2="950" y2="376"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0f7a5c">
    <text x="342" y="357">photo / PDF</text>
    <text x="962" y="357">voice note / text</text>
  </g>

  <!-- Column panels -->
  <rect x="40" y="380" width="580" height="526" rx="18" fill="#e8f5ef" stroke="#cfe6dc"/>
  <rect x="660" y="380" width="580" height="526" rx="18" fill="#e8f5ef" stroke="#cfe6dc"/>
  <text x="64" y="410" font-size="13" font-weight="700" fill="#0f7a5c" letter-spacing="1.2">UNDERSTAND A DOCUMENT</text>
  <text x="684" y="410" font-size="13" font-weight="700" fill="#0f7a5c" letter-spacing="1.2">ANSWER A MESSAGE</text>

  <!-- Column 1 nodes -->
  <g filter="url(#shadow)" stroke-width="1.5">
    <rect x="80" y="428" width="500" height="70" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="80" y="524" width="500" height="70" rx="12" fill="#ffffff" stroke="#0866ff"/>
    <rect x="80" y="620" width="500" height="70" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="80" y="716" width="500" height="70" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="80" y="812" width="500" height="70" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
  </g>
  <rect x="80" y="524" width="8" height="70" rx="4" fill="#0866ff"/>

  <g font-size="17" font-weight="700" fill="#0b3d30">
    <text x="102" y="458">PdfPageSelector</text>
    <text x="102" y="554">DocumentAnalyzer</text>
    <text x="102" y="650">Verifier</text>
    <text x="102" y="746">WhatsAppFormatter + ChecklistBuilder</text>
    <text x="102" y="842">ReminderPlanner</text>
  </g>
  <g font-size="13.5" fill="#4f7266">
    <text x="102" y="482">PDF only: first page + duduk perkara + amar, not all 68 pages</text>
    <text x="102" y="578">reads the photo or pages directly and answers in a JSON schema</text>
    <text x="102" y="674">every key fact must quote the document word for word</text>
    <text x="102" y="770">plain-Indonesian explanation, next steps, what to bring</text>
    <text x="102" y="866">reminders at H-3 · H-1 · H-0, only for verified dates</text>
  </g>
  <rect x="368" y="537" width="196" height="26" rx="13" fill="#0866ff"/>
  <text x="466" y="555" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Muse Spark / Spark Open</text>
  <rect x="478" y="633" width="86" height="26" rx="13" fill="#e8f5ef" stroke="#bfe0d2"/>
  <text x="521" y="651" text-anchor="middle" font-size="13" font-weight="600" fill="#0f7a5c">plain PHP</text>

  <g stroke="#0f7a5c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="330" y1="498" x2="330" y2="520"/>
    <line x1="330" y1="594" x2="330" y2="616"/>
    <line x1="330" y1="690" x2="330" y2="712"/>
    <line x1="330" y1="786" x2="330" y2="808"/>
  </g>

  <!-- Column 2 nodes -->
  <g filter="url(#shadow)" stroke-width="1.5">
    <rect x="700" y="428" width="500" height="70" rx="12" fill="#ffffff" stroke="#0866ff"/>
    <rect x="700" y="530" width="235" height="130" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="965" y="530" width="235" height="130" rx="12" fill="#ffffff" stroke="#0866ff"/>
    <rect x="700" y="692" width="235" height="96" rx="12" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="965" y="692" width="235" height="96" rx="12" fill="#fff7e6" stroke="#e9b949"/>
  </g>
  <rect x="700" y="428" width="8" height="70" rx="4" fill="#0866ff"/>
  <rect x="965" y="530" width="8" height="130" rx="4" fill="#0866ff"/>

  <text x="722" y="458" font-size="17" font-weight="700" fill="#0b3d30">Transcriber</text>
  <text x="722" y="482" font-size="13.5" fill="#4f7266">voice note → text (typed text skips this step)</text>
  <rect x="1004" y="441" width="180" height="26" rx="13" fill="#0866ff"/>
  <text x="1094" y="459" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Muse Voice Transcribe</text>

  <text x="950" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#6b8a7f">or</text>

  <text x="720" y="560" font-size="17" font-weight="700" fill="#0b3d30">Commands</text>
  <g font-size="13.5" fill="#4f7266" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">
    <text x="720" y="586">jadwal · checklist</text>
    <text x="720" y="608">pengadilan · stop</text>
    <text x="720" y="630">ringkasan · bantuan</text>
  </g>

  <text x="987" y="560" font-size="17" font-weight="700" fill="#0b3d30">ConversationAgent</text>
  <rect x="987" y="571" width="96" height="24" rx="12" fill="#0866ff"/>
  <text x="1035" y="588" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Muse Spark</text>
  <text x="987" y="618" font-size="13.5" fill="#4f7266">latest document + last 10</text>
  <text x="987" y="638" font-size="13.5" fill="#4f7266">messages as context</text>

  <text x="720" y="722" font-size="17" font-weight="700" fill="#0b3d30">CourtDirectory</text>
  <text x="720" y="746" font-size="13.5" fill="#4f7266">6 Religious Courts in DIY,</text>
  <text x="720" y="766" font-size="13.5" fill="#4f7266">phone + PTSP Online</text>

  <text x="985" y="722" font-size="17" font-weight="700" fill="#7a5200">Hand off to a person</text>
  <text x="985" y="746" font-size="13.5" fill="#8a6a2a">out of scope → court officer,</text>
  <text x="985" y="766" font-size="13.5" fill="#8a6a2a">logged · ringkasan summary</text>

  <g stroke="#0f7a5c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="817" y1="498" x2="817" y2="526"/>
    <line x1="1082" y1="498" x2="1082" y2="526"/>
    <line x1="817" y1="660" x2="817" y2="688"/>
    <line x1="1082" y1="660" x2="1082" y2="688"/>
  </g>
  <text x="827" y="680" font-size="12" fill="#6b8a7f">pengadilan</text>
  <text x="1092" y="680" font-size="12" fill="#6b8a7f">escalates</text>

  <text x="950" y="836" text-anchor="middle" font-size="14" font-style="italic" fill="#3d6b5c">Pahami explains court procedure; it never gives legal advice</text>
  <text x="950" y="858" text-anchor="middle" font-size="14" font-style="italic" fill="#3d6b5c">or predicts the outcome of a case.</text>

  <!-- Row 3: replies -->
  <g stroke="#0f7a5c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="330" y1="906" x2="330" y2="936"/>
    <line x1="950" y1="906" x2="950" y2="936"/>
  </g>
  <rect x="160" y="940" width="960" height="64" rx="14" fill="#0b3d30" filter="url(#shadow)"/>
  <text x="640" y="970" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Replies</text>
  <text x="640" y="992" text-anchor="middle" font-size="14" fill="#bfe8d8">FonnteClient → WhatsApp   ·   SimulatorClient → browser</text>

  <!-- Row 4: data and scheduler -->
  <g filter="url(#shadow)" stroke-width="1.5">
    <rect x="40" y="1044" width="580" height="96" rx="14" fill="#ffffff" stroke="#bfe0d2"/>
    <rect x="660" y="1044" width="580" height="96" rx="14" fill="#ffffff" stroke="#bfe0d2"/>
  </g>
  <g fill="none" stroke="#0f7a5c" stroke-width="2">
    <ellipse cx="78" cy="1074" rx="14" ry="5"/>
    <path d="M64 1074 v18 a14 5 0 0 0 28 0 v-18"/>
    <path d="M64 1083 a14 5 0 0 0 28 0"/>
  </g>
  <text x="106" y="1082" font-size="18" font-weight="700" fill="#0b3d30">MariaDB</text>
  <text x="64" y="1114" font-size="13.5" fill="#4f7266">users · documents · messages · reminders, shared by every step</text>

  <g fill="none" stroke="#0f7a5c" stroke-width="2">
    <circle cx="698" cy="1078" r="13"/>
    <path d="M698 1070 v8 l6 4" stroke-linecap="round"/>
  </g>
  <text x="724" y="1084" font-size="18" font-weight="700" fill="#0b3d30">Scheduler container</text>
  <text x="684" y="1112" font-size="13.5" fill="#4f7266">reminders:send every 5 min (sends due reminders)</text>
  <text x="684" y="1131" font-size="13.5" fill="#4f7266">media:purge --days=7 every hour (deletes uploaded files)</text>

  <line x1="1100" y1="1044" x2="1100" y2="1008" stroke="#6b8a7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>
</svg>
