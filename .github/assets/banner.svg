<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d30"/>
      <stop offset="0.55" stop-color="#0f7a5c"/>
      <stop offset="1" stop-color="#12936e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3fbf93" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fbf93" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04140f" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screen"><rect x="862" y="46" width="300" height="372" rx="26"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>
  <rect width="1280" height="440" fill="url(#dots)"/>

  <!-- Wordmark: a folded letter with a check mark -->
  <g transform="translate(72 70)">
    <path d="M0 8 a8 8 0 0 1 8 -8 h38 l18 18 v50 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 z" fill="#ffffff"/>
    <path d="M46 0 v12 a6 6 0 0 0 6 6 h12 z" fill="#bfe8d8"/>
    <rect x="12" y="24" width="28" height="5" rx="2.5" fill="#0f7a5c" opacity="0.35"/>
    <rect x="12" y="35" width="38" height="5" rx="2.5" fill="#0f7a5c" opacity="0.35"/>
    <circle cx="52" cy="60" r="17" fill="#3fbf93" stroke="#0f7a5c" stroke-width="4"/>
    <path d="M44 60 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="128" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Pahami</text>

  <!-- Tagline -->
  <text x="74" y="196" font-size="27" font-weight="600" fill="#ffffff">The court’s own AI agent on WhatsApp</text>
  <text x="74" y="234" font-size="20" fill="#d4efe4">Understands court letters · verifies every key fact ·</text>
  <text x="74" y="262" font-size="20" fill="#d4efe4">reminds you before the hearing · hands you to a person</text>

  <!-- Model chips -->
  <g font-size="15" font-weight="600">
    <rect x="74" y="300" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="159" y="323" text-anchor="middle" fill="#ffffff">Muse Spark</text>
    <rect x="256" y="300" width="242" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="377" y="323" text-anchor="middle" fill="#ffffff">Muse Spark Open · Baseten</text>
    <rect x="510" y="300" width="214" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="617" y="323" text-anchor="middle" fill="#ffffff">Muse Voice Transcribe</text>
  </g>

  <text x="74" y="384" font-size="15" fill="#bfe8d8">Religious Courts of Yogyakarta, Indonesia · Meta Global AI Developer Hackathon 2026</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="850" y="34" width="324" height="396" rx="38" fill="#0a1f19"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="862" y="46" width="300" height="372" fill="#efeae2"/>
    <!-- Chat header -->
    <rect x="862" y="46" width="300" height="58" fill="#0f7a5c"/>
    <circle cx="894" cy="75" r="15" fill="#ffffff"/>
    <path d="M887 68 h10 l5 5 v10 a2 2 0 0 1 -2 2 h-13 a2 2 0 0 1 -2 -2 v-13 a2 2 0 0 1 2 -2 z" fill="#0f7a5c"/>
    <text x="918" y="72" font-size="15" font-weight="700" fill="#ffffff">Pahami</text>
    <text x="918" y="90" font-size="11.5" fill="#d4efe4">PTSP · Pengadilan Agama</text>

    <!-- Outgoing: photo of a summons -->
    <rect x="1010" y="118" width="138" height="78" rx="10" fill="#d9fdd3"/>
    <rect x="1018" y="126" width="122" height="52" rx="6" fill="#ffffff"/>
    <rect x="1028" y="134" width="70" height="5" rx="2.5" fill="#9aa39d"/>
    <rect x="1028" y="145" width="100" height="5" rx="2.5" fill="#cfd5d1"/>
    <rect x="1028" y="156" width="88" height="5" rx="2.5" fill="#cfd5d1"/>
    <rect x="1028" y="167" width="60" height="5" rx="2.5" fill="#cfd5d1"/>
    <text x="1140" y="190" font-size="10" fill="#5f6661" text-anchor="end">📷 relaas.jpg</text>

    <!-- Incoming: explanation -->
    <rect x="874" y="208" width="232" height="104" rx="10" fill="#ffffff"/>
    <text x="886" y="230" font-size="13" font-weight="700" fill="#111b21">Surat Panggilan Sidang</text>
    <text x="886" y="250" font-size="12" fill="#111b21">📅 Senin, 16 Nov · 09.00 WIB</text>
    <text x="886" y="268" font-size="12" fill="#111b21">🏛️ PA Bantul, Ruang Sidang 1</text>
    <rect x="886" y="280" width="128" height="20" rx="10" fill="#e3f4e8"/>
    <text x="896" y="294" font-size="11" font-weight="700" fill="#1d7a3a">✓ terverifikasi kutipan</text>

    <!-- Incoming: reminders -->
    <rect x="874" y="322" width="250" height="46" rx="10" fill="#ffffff"/>
    <text x="886" y="342" font-size="12" font-weight="700" fill="#111b21">⏰ Pengingat dijadwalkan</text>
    <text x="886" y="359" font-size="11.5" fill="#5f6661">H-3 · H-1 · pagi hari sidang</text>

    <!-- Incoming: checklist -->
    <rect x="874" y="378" width="190" height="30" rx="10" fill="#ffffff"/>
    <text x="886" y="398" font-size="12" fill="#111b21">✅ Checklist: KTP, surat ini…</text>
  </g>
</svg>
